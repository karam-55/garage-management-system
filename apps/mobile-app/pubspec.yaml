name: garage_mobile_app
description: Garage Management System - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.1
  json_annotation: ^4.8.1
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  lottie: ^3.0.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.2
  image_picker: ^1.0.5
  camera: ^0.10.5+5
  permission_handler: ^11.0.1
  
  # Localization
  easy_localization: ^3.0.3
  
  # Navigation
  go_router: ^13.0.0
  
  # Date & Time
  table_calendar: ^3.0.9
  time_range_picker: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/
