services:
  - type: web
    name: garage-backend
    env: node
    plan: free
    # prisma db push syncs schema without migration files; no --accept-data-loss = safe (refuses destructive changes)
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: garage-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://garage-management-system.pages.dev
      - key: SOCKET_CORS_ORIGIN
        value: https://garage-management-system.pages.dev
      - key: WHATSAPP_API_KEY
        value: ""
      - key: WHATSAPP_API_URL
        value: "https://graph.facebook.com/v18.0"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: ""
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: UPLOAD_DIR
        value: "./uploads"

databases:
  - name: garage-db
    databaseName: garage_db
    user: garage_user

